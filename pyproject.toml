[project]
name = "realestate"
version = "0.1.0"
description = "Fill BC real estate forms from plain-text deal information, flagging anything missing."
requires-python = ">=3.10"
dependencies = ["pypdf>=4", "reportlab>=4"]

[project.optional-dependencies]
test = ["pytest", "pdfplumber"]

[project.scripts]
realestate = "realestate.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["realestate*"]

[tool.setuptools.package-data]
realestate = ["templates/*.pdf"]
